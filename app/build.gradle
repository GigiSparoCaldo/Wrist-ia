plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akemi.wristia'
    compileSdk 34

    defaultConfig {
        applicationId "com.akemi.wristia"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
